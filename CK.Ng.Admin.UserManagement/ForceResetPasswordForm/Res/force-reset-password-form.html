<div class="force-reset-password-form-container">
    <!-- <PreUserReminder revert /> -->
    @if ( userName ) {
        <div class="force-reset-user">
            <span class="force-reset-user-label">{{ 'CK.Admin.UserManagement.User.UserName' | translate }}</span>
            <span class="force-reset-user-value">{{ userName }}</span>
        </div>
    }
    <!-- <PostUserReminder /> -->

    <ck-generic-form [form]="userForm" errorDisplay="tip" />

    <!-- <PrePasswordFormItem revert /> -->
    <ng-template #passwordTemplate let-field>
        <nz-input-wrapper>
            <input nz-input type="text" [formField]="field" autocomplete="new-password"
                   [placeholder]="'CK.Admin.UserManagement.User.Password' | translate" />
            <button nzInputSuffix nz-button nzType="text" nzSize="small" type="button" class="password-refresh"
                    (click)="regeneratePassword()"
                    [title]="'CK.Admin.UserManagement.Form.RegeneratePassword' | translate">
                <fa-icon [icon]="refreshIcon" />
            </button>
        </nz-input-wrapper>
        <ck-password-strength [password]="field().value()" />
    </ng-template>
    <!-- <PostPasswordFormItem /> -->
</div>
