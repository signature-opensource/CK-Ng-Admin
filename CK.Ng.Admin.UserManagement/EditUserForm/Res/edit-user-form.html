<div class="platform-user-form-container">
    <ck-generic-form #formComp [inputFormData]="formData"></ck-generic-form>

    <form nz-form [formGroup]="customForm" nzLayout="vertical">
        <!-- <PreGroupsFormItem revert /> -->
        <nz-form-item>
            <nz-form-label class="form-label" nzRequired>{{'CK.Admin.UserManagement.Form.Groups' | translate}}</nz-form-label>
            <nz-form-control>
                <ck-user-workspace-group-picker
                    [control]="groupsControl"
                    [groups]="workspaceGroups" />
            </nz-form-control>
        </nz-form-item>
        <!-- <PostGroupsFormItem /> -->
        <!-- <PrePasswordFormItem revert /> -->
        <nz-form-item>
            <nz-form-label class="form-label" nzRequired>{{'CK.Admin.UserManagement.User.Password' | translate}}</nz-form-label>
            <nz-form-control [nzErrorTip]="'CK.Admin.UserManagement.Form.PasswordRequired' | translate">
                <nz-input-group [nzSuffix]="passwordTemplate">
                    <input [type]="showPassword ? 'text' : 'password'" nz-input formControlName="password" [placeholder]="'CK.Admin.UserManagement.User.Password' | translate" />
                </nz-input-group>
                <ng-template #passwordTemplate>
                    @if ( showPassword ) {
                        <fa-icon [icon]="eyeIcon" (click)="showPassword = !showPassword"></fa-icon>
                    } @else {
                        <fa-icon [icon]="eyeSlashIcon" (click)="showPassword = !showPassword"></fa-icon>
                    }
                </ng-template>
            </nz-form-control>
        </nz-form-item>
        <!-- <PostPasswordFormItem /> -->
    </form>
</div>
