<ck-backoffice-layout-content
    class="admin-layout"
    [headerTitle]="title()"
    [showFilters]="false">
    <div class="layout-content">
        <nz-tabs class="tabset" [nzSize]="'large'" [nzSelectedIndex]="selectedTabIndex()" (nzSelectedIndexChange)="onTabIndexChange($event)">
            <!-- <PreUserManagementTabsRegistration revert /> -->
            <!-- <PreUsersTab revert /> -->
            <nz-tab [nzTitle]="'CK.Admin.UserManagement.Tab.Users' | translate">
                <ck-users-tab
                    #usersTab
                    [workspace]="workspace()"
                    (userCreated)="onUserCreated()" />
            </nz-tab>
            <!-- <PostUsersTab /> -->
            <!-- <PostUserManagementTabsRegistration /> -->
        </nz-tabs>
    </div>
</ck-backoffice-layout-content>
