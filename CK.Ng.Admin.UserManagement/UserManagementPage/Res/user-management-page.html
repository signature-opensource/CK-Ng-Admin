<ck-backoffice-layout-content
    class="admin-layout"
    [headerTitle]="title()"
    [showFilters]="false">
    <div class="layout-content">
        <nz-tabset class="tabset" [nzSize]="'large'" [nzSelectedIndex]="selectedTabIndex()" (nzSelectedIndexChange)="onTabIndexChange($event)">
            <!-- <PreUserManagementTabsRegistration revert /> -->
            <!-- <PreUsersTab revert /> -->
            <nz-tab [nzTitle]="'CK.Admin.UserManagement.Tab.Users' | translate">
                <ck-users-tab
                    #usersTab
                    [workspace]="workspace()"
                    (invitationCreated)="onInvitationCreated()" />
            </nz-tab>
            <!-- <PostUsersTab /> -->
            <!-- <PreInvitationsTab revert /> -->
            <nz-tab [nzTitle]="'CK.Admin.UserManagement.Tab.Invitations' | translate">
                <ng-template nz-tab>
                    @if ( workspaceId() > 0 ) {
                        <ck-invitations-table
                            #invitationsTable
                            [workspaceId]="workspaceId()" />
                    }
                </ng-template>
            </nz-tab>
            <!-- <PostInvitationsTab /> -->
            <!-- <PostUserManagementTabsRegistration /> -->
        </nz-tabset>
    </div>
</ck-backoffice-layout-content>
