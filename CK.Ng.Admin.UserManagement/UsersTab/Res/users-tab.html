<ck-table
    class="users-tab-table"
    #table
    [tableData]="users()"
    [dataUniqueKey]="'userId'"
    [columns]="columns"
    [totalCount]="getTotalCount()"
    [totalCountLabel]="'CK.Admin.UserManagement.Tab.Users' | translate"
    (selectionChanged)="onTableSelection($event)">
</ck-table>

<ng-template #roleCellTemplate let-user="row">
    @if ( user.isWorkspaceAdmin ) {
        <nz-tag nzColor="geekblue">{{ 'CK.Admin.UserManagement.Role.Administrator' | translate }}</nz-tag>
    } @else {
        <nz-tag>{{ 'CK.Admin.UserManagement.Role.Member' | translate }}</nz-tag>
    }
</ng-template>
