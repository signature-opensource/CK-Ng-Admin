<div class="platform-user-form-container">
    <ck-generic-form [form]="userForm" />

    <!-- <PreGroupsFormItem revert /> -->
    <ng-template #groupsTemplate let-field>
        <!-- <PreOrgGroupSelection revert /> -->
        @if ( selectedOrg ) {
            <div class="groups">
                <nz-select class="org-select" [style]="{ 'width': '100%', 'margin-bottom': '2%' }" [(ngModel)]="selectedOrg" [ngModelOptions]="{standalone: true}">
                    @for ( org of getOrgs(); track org.groupId ) {
                        <nz-option [nzValue]="org" [nzLabel]="org.groupName"></nz-option>
                    }
                </nz-select>
                <div class="group-choices">
                    <label
                        nz-checkbox
                        [(ngModel)]="map.get( selectedOrg.groupId )!.checked"
                        [ngModelOptions]="{standalone: true}"
                        (nzCheckedChange)="selectGroup( selectedOrg.groupId, $event ); field().markAsTouched()">
                        {{ 'CK.Admin.UserManagement.Role.Member' | translate }}
                    </label>
                    <label
                        nz-checkbox
                        [(ngModel)]="map.get( getAdminGroupId( selectedOrg.groupId ) )!.checked"
                        [ngModelOptions]="{standalone: true}"
                        (nzCheckedChange)="selectAdminGroup( selectedOrg.groupId, $event ); field().markAsTouched()">
                        {{ 'CK.Admin.UserManagement.Role.Administrator' | translate }}
                    </label>
                </div>
                @for ( w of getChildren( selectedOrg.groupId ); track w.groupId ) {
                    <div class="warehouse-groups">
                        <div class="group-label">
                            <fa-icon class="icon" [icon]="icon"></fa-icon>
                            <span>{{ w.groupName }}</span>
                        </div>
                        <div class="group-choices">
                            <label
                                nz-checkbox
                                [(ngModel)]="map.get( w.groupId )!.checked"
                                [ngModelOptions]="{standalone: true}"
                                (nzCheckedChange)="selectGroup( w.groupId, $event ); field().markAsTouched()">
                                {{ 'CK.Admin.UserManagement.Role.Member' | translate }}
                            </label>
                            <label
                                nz-checkbox
                                [(ngModel)]="map.get( getAdminGroupId( w.groupId ) )!.checked"
                                [ngModelOptions]="{standalone: true}"
                                (nzCheckedChange)="selectAdminGroup( w.groupId, $event ); field().markAsTouched()">
                                {{ 'CK.Admin.UserManagement.Role.Administrator' | translate }}
                            </label>
                        </div>
                    </div>
                }
            </div>
        } @else {
            <!-- <PreGroupPickerFallback revert /> -->
            <ck-user-workspace-group-picker
                [formField]="field"
                [groups]="groupInfos" />
            <!-- <PostGroupPickerFallback /> -->
        }
        <!-- <PostOrgGroupSelection /> -->
    </ng-template>
    <!-- <PostGroupsFormItem /> -->
</div>
