<div class="ban-user-form-container">
    <!-- <PreBannedUsersReminder revert /> -->
    @if ( userNames.length > 0 ) {
        <div class="banned-users">
            <span class="banned-users-label">{{ 'CK.Admin.UserManagement.Ban.TargetedUsers' | translate }}</span>
            <span class="banned-users-value">{{ userNames.join( ', ' ) }}</span>
        </div>
    }
    <!-- <PostBannedUsersReminder /> -->

    <ck-generic-form [form]="banForm" />

    <!-- <PreBanDuration revert /> -->
    <ng-template #endDateTemplate let-field>
        <nz-date-picker
            class="ban-end-date"
            [formField]="field"
            [nzShowTime]="{ nzFormat: 'HH:mm' }"
            nzFormat="dd-MM-yyyy HH:mm"
            [nzDisabledDate]="disabledEndDate"
            [nzDisabledTime]="disabledEndTime" />
    </ng-template>
    <!-- <PostBanDuration /> -->
</div>
